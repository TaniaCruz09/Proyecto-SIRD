# Render Blueprint — despliega el backend NestJS (SIRD) en Render.
# Las variables con "sync: false" se piden al crear el servicio desde el dashboard
# (así los secretos nunca quedan en el repositorio).
services:
  - type: web
    name: sird-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # IMPORTANTE: DB_SYNC=true permite que TypeORM modifique el esquema en cada
      # arranque. Cámbialo a "false" (y ejecuta `npm run migration:run`) cuando
      # exista una migración base completa; hoy las migraciones son incrementales.
      - key: DB_SYNC
        value: "true"
      - key: MIGRATIONS_TABLE_NAME
        value: migrations
      # Cambiar por el dominio real del frontend (varios separados por coma).
      - key: CORS_ORIGIN
        value: http://localhost:3000
      # Con NODE_ENV=production Swagger queda apagado salvo que esto sea "true".
      - key: SWAGGER_ENABLED
        value: "false"
      # Los archivos de /uploads siguen siendo públicos (comportamiento actual).
      # Ponlo en "true" para exigir sesión al descargar expedientes.
      - key: PROTECT_UPLOADS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
